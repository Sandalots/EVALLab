name: "TextAttack"
path_pattern: "TextAttack"

dependencies:
  - "bert-score>=0.3.5"
  - "datasets>=2.4.0"
  - "torch>=1.7.0,!=1.8"
  - "transformers>=4.30.0"
  - "nltk"
  - "tqdm"
  - "gensim"

pre_run_setup: []  # No special setup needed

experiments:
  - name: "attack_roberta_sst2"
    type: "shell_script"
    path: "examples/attack/attack_roberta_sst2_textfooler.sh"
    patch_script:
      enabled: true
      log_csv_path: "log.csv"
      description: "Patch script to output log.csv for per-example tracking"
      modifications:
        - search: "textattack attack"
          replace: "textattack attack --log-to-csv log.csv --num-workers-per-device 1"
    args: []
    timeout: 600
    description: "Run TextFooler attack on RoBERTa SST-2 model"
  
  # Pytest tests disabled - they test codebase unit tests, not paper reproducibility
  # - name: "word_embedding_test"
  #   type: "pytest"
  #   path: "tests/test_word_embedding.py"
  #   args: ["-v", "-s"]
  #   timeout: 180
  #   description: "Run word embedding tests (GloVe, Gensim)"
  # 
  # - name: "transformations_test"
  #   type: "pytest"
  #   path: "tests/test_transformations.py::test_word_swap_change_location"
  #   args: ["-v", "-s"]
  #   timeout: 180
  #   description: "Run word transformation tests"
  # 
  # - name: "augmentation_test"
  #   type: "pytest"
  #   path: "tests/test_augment_api.py"
  #   args: ["-v", "-s", "-k", "test_embedding_augmenter"]
  #   timeout: 180
  #   description: "Run data augmentation API tests"

baseline:
  save_baseline: true
  baseline_file: "paper_metrics.json"

metrics:
  per_example: true
  source: "log.csv"
  extractors:
    - pattern: "Number of successful attacks:\\s+([0-9]+)"
      name: "num_successful_attacks"
    - pattern: "Number of failed attacks:\\s+([0-9]+)"
      name: "num_failed_attacks"
    - pattern: "Number of skipped attacks:\\s+([0-9]+)"
      name: "num_skipped_attacks"
    - pattern: "Original accuracy:\\s+([0-9.]+)%"
      name: "original_accuracy"
      transform: "percent_to_decimal"
    - pattern: "Accuracy.*under attack:\\s+([0-9.]+)%"
      name: "accuracy_under_attack"
      transform: "percent_to_decimal"
    - pattern: "Attack.*success rate:\\s+([0-9.]+)%"
      name: "attack_success_rate"
      transform: "percent_to_decimal"
    - pattern: "Average perturbed word %:\\s+([0-9.]+)%"
      name: "avg_perturbed_word_%"
      transform: "percent_to_decimal"
    - pattern: "Average num\\. words per input:\\s+([0-9.]+)"
      name: "avg_num_words_per_input"
    - pattern: "Avg num queries:\\s+([0-9.]+)"
      name: "avg_num_queries"

outputs:
  log_file: "log.csv"
  results_file: "complete_results.json"
