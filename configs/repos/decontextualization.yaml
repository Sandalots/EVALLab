name: "Decontextualization"
path_pattern: "decontextualization"

dependencies:
  - "datasets>=2.14.0"
  - "transformers>=4.35.0"
  - "torch>=2.0.0"
  - "numpy>=1.24.0"
  - "pandas>=2.0.0"
  - "scikit-learn>=1.3.0"
  - "tqdm>=4.65.0"
  - "pyserini>=0.22.0"
  - "sentence-transformers>=2.2.0"
  - "rouge-score>=0.1.2"
  - "nltk>=3.8.0"

pre_run_setup: []

experiments:
  - name: "main_experiment"
    type: "python_script"
    path: "code/main_local_all_new.py"
    args:
      - "--config"
      - "code/config_local_all.yaml"
    timeout: 1200
    description: "Run decontextualization retrieval and QA experiments"

baseline:
  save_baseline: true
  baseline_file: "paper_metrics.json"
  comparison_file: "complete_results.json"

metrics:
  per_example: false
  extractors:
    - pattern: 'Recall@10[=:]\s*([0-9.]+)'
      name: "recall_at_10"
    - pattern: 'MRR[=:]\s*([0-9.]+)'
      name: "mrr"
    - pattern: 'Accuracy[=:]\s*([0-9.]+)'
      name: "accuracy"
    - pattern: 'F1[=:]\s*([0-9.]+)'
      name: "f1_score"

outputs:
  results_file: "code/complete_results.json"
  report_file: "code/outputs_all_methods/report.md"

data_validation:
  data_dir: "code/data"
  required_files:
    - filename: "qa.jsonl"
      min_lines: 500
      description: "Q&A dataset"
    - filename: "papers.jsonl"
      min_lines: 50
      description: "Papers corpus"
    - filename: "qa-unlabeled.jsonl"
      min_lines: 1000
      description: "Unlabeled Q&A"
    - filename: "qa-augmented-answers.jsonl"
      min_lines: 500
      description: "Augmented answers"
