name: "AIX360"
path_pattern: "AIX360"

dependencies:
  - "numpy<=1.24.3"
  - "scikit-learn<1.2.0"
  - "cvxpy>=1.1"
  - "ecos"
  - "pandas<2.0.0"
  - "scipy>=0.17,<=1.10.1"
  - "matplotlib"

pre_run_setup: []  # pandas imports already patched in repo files

experiments:
  - name: "boolean_rule_test"
    type: "pytest"
    path: "tests/rbm/test_Boolean_Rule_CG.py"
    args: ["-v"]
    timeout: 120
    description: "Run Boolean Rule Column Generation test"
  
  - name: "rbm_metrics"
    type: "python_script"
    path: "run_rbm_metrics.py"
    generate: true
    template: |
      #!/usr/bin/env python3
      """
      AIX360 RBM Metrics Extraction Script
      Auto-generated by EVALLab
      """
      import pandas as pd
      from sklearn.datasets import load_breast_cancer
      from sklearn.model_selection import train_test_split
      from sklearn.metrics import accuracy_score, precision_score, recall_score, f1_score
      from aix360.algorithms.rbm import FeatureBinarizer, BRCGExplainer, BooleanRuleCG

      def main():
          print("=" * 80)
          print("AIX360 Boolean Rule Column Generation - Metrics Extraction")
          print("=" * 80)
          
          bc = load_breast_cancer()
          bc_df = pd.DataFrame(bc.data, columns=bc.feature_names)
          X_train, X_test, Y_train, Y_test = train_test_split(
              bc_df, bc.target, test_size=0.2, random_state=31
          )
          
          print("\n[1/3] Feature Binarization...")
          fb = FeatureBinarizer(negations=True)
          X_train_fb = fb.fit_transform(X_train)
          X_test_fb = fb.transform(X_test)
          print(f"  ✓ Features: {len(X_train_fb.columns)}")
          
          print("\n[2/3] Training Boolean Rule Model...")
          boolean_model = BooleanRuleCG(silent=True)
          explainer = BRCGExplainer(boolean_model)
          explainer.fit(X_train_fb, Y_train)
          print("  ✓ Model trained")
          
          print("\n[3/3] Evaluating Model...")
          Y_pred = explainer.predict(X_test_fb)
          
          accuracy = accuracy_score(Y_test, Y_pred)
          precision = precision_score(Y_test, Y_pred)
          recall = recall_score(Y_test, Y_pred)
          f1 = f1_score(Y_test, Y_pred)
          
          print("\n" + "=" * 80)
          print("METRICS SUMMARY")
          print("=" * 80)
          print(f"Accuracy: {accuracy:.4f}")
          print(f"Precision: {precision:.4f}")
          print(f"Recall: {recall:.4f}")
          print(f"F1 Score: {f1:.4f}")
          print("=" * 80)
          
          explanation = explainer.explain()
          print("\nLEARNED RULES:")
          for i, rule in enumerate(explanation['rules'], 1):
              print(f"  {i}. {rule}")
          
          print("\n✓ Metrics extraction complete")
          
          return {
              'accuracy': accuracy,
              'precision': precision,
              'recall': recall,
              'f1_score': f1,
              'num_rules': len(explanation['rules'])
          }

      if __name__ == '__main__':
          main()
    timeout: 60
    description: "Extract performance metrics from RBM model"
  
  - name: "lime_test"
    type: "pytest"
    path: "tests/lime/test_lime.py::TestLIMEExplainer::test_LIME"
    args: ["-v", "-s"]
    timeout: 180
    description: "Run LIME explainer test on iris dataset"
  
  - name: "shap_test"
    type: "pytest"
    path: "tests/shap/test_shap.py::TestShapExplainer::test_Shap"
    args: ["-v", "-s"]
    timeout: 180
    description: "Run SHAP explainer test on iris dataset"
  
  - name: "logistic_rule_test"
    type: "pytest"
    path: "tests/rbm/test_Logistic_Rule_Regression.py"
    args: ["-v"]
    timeout: 180
    description: "Run Logistic Rule Regression test on breast cancer dataset"

baseline:
  strategy: "double_run"
  save_baseline: true
  baseline_file: "paper_metrics.json"
  comparison_file: "complete_results.json"

metrics:
  per_example: false
  extractors:
    - pattern: "Accuracy:\\s+([0-9.]+)"
      name: "accuracy"
    - pattern: "Precision:\\s+([0-9.]+)"
      name: "precision"
    - pattern: "Recall:\\s+([0-9.]+)"
      name: "recall"
    - pattern: "F1 Score:\\s+([0-9.]+)"
      name: "f1_score"

outputs:
  results_file: "complete_results.json"
